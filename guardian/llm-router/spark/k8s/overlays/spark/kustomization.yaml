# Node-specific overlay for the DGX Spark: pins the HF cache hostPath (the
# installer rewrites it in its staged copy — the repo keeps a placeholder)
# and the vLLM image tag.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../cluster

patches:
  - path: hf-cache-pv-patch.yaml
    target:
      kind: PersistentVolume
      name: hf-cache

images:
  - name: nvcr.io/nvidia/vllm
    newTag: 26.02-py3

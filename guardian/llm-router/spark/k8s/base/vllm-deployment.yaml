# The serving Deployment. The controller never creates pods: it patches
# spec.template (annotations + container args) and lets the Recreate rollout
# replace the pod. args below equal pod_args(profiles.json["qwen3-instruct"]).
#
# - Recreate: with one GPU, a RollingUpdate new-pod would sit Pending forever.
# - enableServiceLinks: false — a Service named vllm-coder would inject
#   VLLM_CODER_* env vars, and vLLM reads every VLLM_* variable.
# - No memory limit: GPU allocations on unified memory may land in the pod
#   cgroup; a limit could OOMKill a healthy load (design §3.2, §9).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-coder
  namespace: spark-llm
  labels:
    app: vllm-coder
spec:
  replicas: 1
  strategy:
    type: Recreate
  # vLLM loads 60-80 GB weights; READY_TIMEOUT is 1800 s and the default
  # progressDeadlineSeconds (600) would mark the rollout failed first.
  progressDeadlineSeconds: 2400
  selector:
    matchLabels:
      app: vllm-coder
  template:
    metadata:
      labels:
        app: vllm-coder
      annotations:
        spark-switch/profile: qwen3-instruct
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: nvcr.io/nvidia/vllm:26.02-py3
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen3-30B-A3B-Instruct-2507-FP8"
            - "--served-model-name"
            - "qwen3-instruct"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--gpu-memory-utilization"
            - "0.40"
            - "--max-model-len"
            - "65536"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "hermes"
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi

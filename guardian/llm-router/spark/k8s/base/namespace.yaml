# Namespace spark-llm with Pod Security Admission enforcement at "baseline".
# baseline rejects privileged containers, host namespaces (hostPID/hostIPC/
# hostNetwork), hostPath volumes and hostPorts — so even a Deployment patch
# from a compromised controller cannot land a host-root pod. See
# docs/internal/SPARK-K8S-DESIGN.md §6.
---
apiVersion: v1
kind: Namespace
metadata:
  name: spark-llm
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest

# 배포 대상 설정 — 시크릿 아님 (커밋됨).
# 토큰은 여기에 두지 않는다. 저장소 밖 자격증명 파일에 둔다:
#   ~/.config/gitea/hosts/<GITEA_HOST>.env   (chmod 600, GITEA_TOKEN=...)

# Gitea 호스트 (자격증명 파일명을 결정한다)
GITEA_HOST=git.example.com

# 대상 저장소
GITEA_REPO=your-org/openwebui-wiki-bundle

# 업로드용 API 엔드포인트.
# git.example.com 는 Cloudflare 프록시라 업로드 본문이 100MB로 제한된다(HTTP 413).
# 800MB+ 번들을 올리려면 origin 직결 엔드포인트를 써야 한다.
GITEA_API=https://git-origin.example.com/api/v1
